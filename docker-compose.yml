version: '2.4'

# Compatible con docker-compose v1 (sin x-*, sin deploy:, con mem_limit).
# Puertos distintos a facturacion: API 4100 (billing 3100) y Postgres 5433.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuvex_shalom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:-nuvex_shalom}
    ports:
      - '127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5433}:5432'
    volumes:
      - shalom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - shalom-network

  api:
    image: shalom-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER:-nuvex_shalom}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:-nuvex_shalom}?schema=public
      TZ: America/Lima
    command:
      - sh
      - -c
      - npx prisma migrate deploy && node --enable-source-maps dist/apps/api/apps/api/src/main.js
    ports:
      - '127.0.0.1:${API_PUBLISHED_PORT:-4100}:4100'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    shm_size: '1gb'
    networks:
      - shalom-network

  worker:
    image: shalom-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER:-nuvex_shalom}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:-nuvex_shalom}?schema=public
      TZ: America/Lima
    command:
      - node
      - --enable-source-maps
      - dist/apps/worker/apps/worker/src/main.js
    depends_on:
      api:
        condition: service_healthy
    shm_size: '1gb'
    mem_limit: 2g
    networks:
      - shalom-network

volumes:
  shalom-postgres-data:

networks:
  shalom-network:
    driver: bridge
